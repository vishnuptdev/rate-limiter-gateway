# ingress-nginx using RateGuard as the auth-url (forward auth). ingress-nginx
# sends X-Original-URI and X-Original-Method with the auth subrequest, which
# RateGuard reads. Add the ingress controller's pod/node CIDR to RateGuard's
# Settings -> Trusted proxies so client IPs come from X-Forwarded-For.
# Annotation reference:
# https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#external-authentication
#
# LIMITATION: as with plain NGINX auth_request, only 401/403 from the auth
# service reach the client; RateGuard's 429 surfaces as a 500. Use RateGuard as
# a reverse proxy, or Traefik/Envoy, if clients must see a 429.
#
# Keep the RateGuard Service cluster-internal (the endpoint is unauthenticated
# by default) or enable Settings -> Forward auth require token.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://rateguard.default.svc.cluster.local:8080/_rlg/v1/auth"
    # Copied from the auth response onto the request sent to the backend.
    nginx.ingress.kubernetes.io/auth-response-headers: "X-RateGuard-Consumer, RateLimit-Limit, RateLimit-Remaining, RateLimit-Reset"
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: your-service
                port:
                  number: 80
