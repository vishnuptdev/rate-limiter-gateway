# NGINX in front of RateGuard, which is in front of your service.
#
# This file is named after the common pattern, but it does NOT use auth_request.
# auth_request sends a body-less subrequest and expects a 2xx/4xx status back from
# an endpoint that answers GET. RateGuard's check API is a JSON POST whose decision
# is in the response body (it returns 200 even when a request is limited), so
# NGINX cannot act on it through auth_request.
#
# The supported integration is to put RateGuard in the request path as a reverse
# proxy. Clients call NGINX, NGINX forwards to RateGuard, and RateGuard enforces the
# limits and forwards allowed requests to your upstream (configured as a route in
# the RateGuard dashboard).
#
# Trusted proxies: add this NGINX host's address to Settings -> Trusted proxies in
# RateGuard, so client IPs are read from X-Forwarded-For.

upstream rateguard {
    # Both RateGuard instances. They share limits and config through Redis.
    server rateguard-1:8080;
    server rateguard-2:8080;
    keepalive 32;
}

server {
    listen 80;
    # listen 443 ssl; with your certificate and key, for production.
    server_name api.example.com;

    # Keep the client's API key header; RateGuard reads it and forwards it upstream.
    # RateGuard strips inbound X-RateGuard-* headers, so clients cannot spoof them.

    location / {
        proxy_pass http://rateguard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Pass 429 responses and RateLimit-* headers to the client unchanged.
        proxy_pass_header RateLimit-Limit;
        proxy_pass_header RateLimit-Remaining;
        proxy_pass_header RateLimit-Reset;
        proxy_pass_header RateLimit-Policy;
    }
}
