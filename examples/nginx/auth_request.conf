# NGINX auth_request in front of your own upstream, using RateGuard's
# forward-auth endpoint (GET/POST/... /_rlg/v1/auth). RateGuard never proxies
# in this mode: it only answers "allow" (200) or "deny" for each request.
#
# Setup in RateGuard:
#  - Add this NGINX host's address to Settings -> Trusted proxies, so the
#    client IP is read from the X-Forwarded-For header set below.
#  - Create routes whose host/path match what NGINX serves. The route's
#    "upstream" is not used in this mode. Or pin one route with
#    ?route_id=<id> on the auth URL.
#  - The endpoint is unauthenticated by default: keep it reachable only from
#    NGINX's network, or enable Settings -> Forward auth require token and
#    uncomment the X-RateGuard-Auth-Token line (a token with scope "check").
#
# Getting a real 429: stock auth_request only passes 401 and 403 from the auth
# subrequest to the client; any other non-2xx status (including 400, 404 and 503 from RateGuard) becomes a 500. So the auth
# URL below asks RateGuard to answer limited requests with 403
# (?deny_status=403), and `error_page 403 = @ratelimited` turns that into a 429
# with Retry-After. RateGuard only answers 403 for limited requests (bad or
# missing API keys are 401). If Retry-After is empty on your NGINX version the
# header is simply omitted. See
# https://nginx.org/en/docs/http/ngx_http_auth_request_module.html

upstream rateguard {
    server rateguard-1:8080;
    server rateguard-2:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;

    location = /_rateguard_auth {
        internal;
        proxy_pass http://rateguard/_rlg/v1/auth?deny_status=403;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_read_timeout    5s;

        # The auth subrequest has no body.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # Describe the original request to RateGuard.
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-Uri    $request_uri;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-For    $remote_addr;
        # proxy_set_header X-RateGuard-Auth-Token "rgt_...";
        # The consumer's API key header (default X-API-Key) is passed through
        # from the original request automatically.
    }

    location / {
        auth_request /_rateguard_auth;
        error_page 403 = @ratelimited;

        # Copy RateGuard's decision headers: RateLimit-* to the client,
        # the consumer id to the upstream.
        auth_request_set $rg_limit     $upstream_http_ratelimit_limit;
        auth_request_set $rg_remaining $upstream_http_ratelimit_remaining;
        auth_request_set $rg_reset     $upstream_http_ratelimit_reset;
        auth_request_set $rg_retry     $upstream_http_retry_after;
        auth_request_set $rg_consumer  $upstream_http_x_rateguard_consumer;
        add_header RateLimit-Limit     $rg_limit     always;
        add_header RateLimit-Remaining $rg_remaining always;
        add_header RateLimit-Reset     $rg_reset     always;
        # Overwrite any client-supplied value so it cannot be spoofed.
        proxy_set_header X-RateGuard-Consumer $rg_consumer;

        proxy_pass http://your-upstream:3000;
        proxy_set_header Host $host;
    }

    location @ratelimited {
        add_header Retry-After $rg_retry always;
        add_header RateLimit-Limit     $rg_limit     always;
        add_header RateLimit-Remaining $rg_remaining always;
        add_header RateLimit-Reset     $rg_reset     always;
        default_type application/json;
        return 429 '{"error":"rate_limited","message":"Rate limit exceeded"}';
    }
}
